<svg viewBox="0 0 1200 935" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="ClaimGuard AI architecture: a supervised risk model and an unsupervised anomaly detector are both trained from the same train split, but the anomaly detector never sees the fraud label; both surface through a read-only dashboard and API.">
  <title>ClaimGuard AI architecture</title>
  <desc>Shows what each model is fit on, that the Isolation Forest anomaly detector is trained on the same train split but never touches the FraudFound_P target, and that the dashboard and API are read-only presentation surfaces with no path back into the data or models.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="935" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0F172A">ClaimGuard AI — Architecture</text>
  <text x="600" y="53" text-anchor="middle" font-size="12.5" fill="#475569">What each model is fit on, and which signal never sees the label</text>
  <line x1="50" y1="64" x2="1150" y2="64" stroke="#E2E8F0" stroke-width="1"/>

  <!-- ===== Shared box styles via groups ===== -->

  <!-- D1 Source -->
  <rect x="470" y="80" width="260" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="600" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">fraud_oracle.csv</text>
  <text x="600" y="119" text-anchor="middle" font-size="10.5" fill="#475569">15,420 claims · 1994–96</text>
  <line x1="600" y1="136" x2="600" y2="160" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D2 Prepare -->
  <rect x="420" y="164" width="360" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="600" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Prepare data</text>
  <text x="600" y="203" text-anchor="middle" font-size="10.5" fill="#475569">validate → fix sentinels → build pipeline</text>
  <line x1="600" y1="220" x2="600" y2="244" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- D3 Split -->
  <rect x="390" y="248" width="420" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="600" y="270" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Stratified split</text>
  <text x="600" y="287" text-anchor="middle" font-size="10.5" fill="#475569">60% train · 20% validation · 20% test</text>

  <!-- train stub + bus -->
  <line x1="600" y1="304" x2="600" y2="332" stroke="#64748B" stroke-width="1.5"/>
  <text x="608" y="322" font-size="9.5" fill="#64748B">train</text>
  <line x1="65" y1="332" x2="905" y2="332" stroke="#64748B" stroke-width="1.5"/>

  <!-- independence rail: train -> Isolation Forest, bypassing the supervised branch entirely -->
  <line x1="65" y1="332" x2="65" y2="622" stroke="#B45309" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="76" y="478" font-size="10" fill="#B45309">train features only</text>
  <text x="76" y="492" font-size="10" fill="#B45309">— never sees FraudFound_P</text>

  <!-- drops into LR / XGB -->
  <line x1="305" y1="332" x2="305" y2="348" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="905" y1="332" x2="905" y2="348" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Models row -->
  <rect x="160" y="352" width="290" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="305" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Logistic Regression</text>
  <text x="305" y="391" text-anchor="middle" font-size="10.5" fill="#475569">baseline</text>

  <rect x="760" y="352" width="290" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="905" y="374" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">XGBoost</text>
  <text x="905" y="391" text-anchor="middle" font-size="10.5" fill="#475569">candidate</text>

  <!-- Models -> Selection -->
  <polyline points="305,408 305,428 520,428 520,436" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="905,408 905,428 680,428 680,436" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Selection -->
  <rect x="430" y="440" width="340" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="600" y="462" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Model selection</text>
  <text x="600" y="479" text-anchor="middle" font-size="10.5" fill="#475569">validation PR-AUC: 0.255 vs 0.154</text>
  <line x1="600" y1="496" x2="600" y2="520" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Saved model (key artifact) -->
  <rect x="400" y="524" width="400" height="58" rx="7" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="600" y="548" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1E3A8A">Saved model</text>
  <text x="600" y="566" text-anchor="middle" font-size="10.5" font-family="SFMono-Regular, Menlo, Consolas, monospace" fill="#1D4ED8">selected_pipeline_xgboost.joblib</text>

  <!-- saved model stub + bus -->
  <line x1="600" y1="582" x2="600" y2="602" stroke="#64748B" stroke-width="1.5"/>
  <line x1="470" y1="602" x2="1050" y2="602" stroke="#64748B" stroke-width="1.5"/>
  <line x1="470" y1="602" x2="470" y2="618" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="760" y1="602" x2="760" y2="618" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1050" y1="602" x2="1050" y2="618" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Row 3: four consumers -->
  <rect x="50" y="622" width="260" height="64" rx="7" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/>
  <text x="180" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#78350F">Isolation Forest</text>
  <text x="180" y="665" text-anchor="middle" font-size="10.5" fill="#92400E">anomaly score</text>

  <rect x="340" y="622" width="260" height="64" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="470" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">SHAP</text>
  <text x="470" y="665" text-anchor="middle" font-size="10.5" fill="#475569">explains predictions</text>

  <rect x="630" y="622" width="260" height="64" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="760" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Test evaluation</text>
  <text x="760" y="665" text-anchor="middle" font-size="10.5" fill="#475569">scored once · PR-AUC 0.242</text>

  <rect x="920" y="622" width="260" height="64" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="1050" y="648" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">FastAPI /score</text>
  <text x="1050" y="665" text-anchor="middle" font-size="10.5" fill="#475569">live, single-claim scoring</text>

  <!-- IF + SHAP -> Scored claims -->
  <polyline points="180,686 180,706 325,706" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <polyline points="470,686 470,706 325,706" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="325" y1="706" x2="325" y2="716" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="720" width="270" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="325" y="742" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Scored claims</text>
  <text x="325" y="759" text-anchor="middle" font-size="10.5" fill="#475569">risk + anomaly + SHAP reasons</text>

  <!-- Scored claims + Test evaluation -> Dashboard -->
  <polyline points="325,776 325,796 530,796" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <polyline points="760,686 760,796 530,796" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <line x1="530" y1="796" x2="530" y2="806" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="300" y="810" width="460" height="56" rx="7" fill="#F8FAFC" stroke="#475569" stroke-width="1.3"/>
  <text x="530" y="832" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Streamlit dashboard</text>
  <text x="530" y="849" text-anchor="middle" font-size="10.5" fill="#475569">analyst queue + explanations</text>

  <!-- footer -->
  <line x1="50" y1="886" x2="1150" y2="886" stroke="#E2E8F0" stroke-width="1"/>
  <text x="600" y="908" text-anchor="middle" font-size="11" font-style="italic" fill="#64748B">Decision-support only — every score requires human review; nothing here writes back to a claim.</text>
</svg>
